[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project]
name = "app"
version = "0.1.0"
description = "Web UI for Private Assistant ecosystem with device management and picture display"
authors = [
    { name = "stkr22", email = "stkr22@github.com" }
]
readme = "README.md"
license = "GPL-3.0-only"

keywords = ["home-automation", "private-assistant", "web-ui", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Programming Language :: Python",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Home Automation",
]

requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]~=0.123.4",
    "pwdlib[argon2,bcrypt]~=0.3.0",
    "tenacity~=9.1.2",
    "alembic~=1.17.2",
    "pydantic-settings",
    "private-assistant-commons~=6.3.0",
    "minio~=7.2.20",
    "greenlet~=3.3.0",
    "httpx",
    "private-assistant-picture-display-skill~=0.6.0",
    "joserfc~=1.6.1",
]

[project.urls]
Homepage = "https://github.com/stkr22/private-assistant-web-ui"
Repository = "https://github.com/stkr22/private-assistant-web-ui"

[dependency-groups]
dev = [
    "ruff~=0.14.14",
    "mypy~=1.19.1",
    "pytest~=9.0.2",
    "pytest-cov~=7.0.0",
    "factory-boy~=3.3.0",
]
